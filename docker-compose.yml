# Flutter Health Companion - Hostinger Docker Deployment
# Use with Hostinger DockerManager "Compose Manually" feature

version: '3.8'

services:
  # Flutter Web App - Nginx serving PWA
  flutter-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-companion-flutter
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - health-network
 healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  health-network:
    driver: bridge